function enterGuest(){
  guest=true;user={uid:'guest',email:'試用模式'};
  try{cards=JSON.parse(localStorage.getItem('vocab-guest-v1')||'null')||[]}catch(e){cards=[]}
  try{S={...DS,...JSON.parse(localStorage.getItem('vocab-guest-set')||'{}')}}catch(e){}
  if(!cards.length){cards=parse(GSEED).map(mk);gsave()}
  ready=true;loaded=true;msg='';tab='r';buildQueue();render();
}
function exitGuest(){guest=false;user=null;cards=[];queue=[];msg='';render()}
async function login(){
  if(!fb){msg='目前無法連線到 Google 登入服務，請改用試用模式，或稍後再試';render();return}
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}catch(e){
    if(e.code=='auth/popup-blocked')signInWithRedirect(auth,p);
    else{msg='登入失敗：'+(e.code||e.message)+(e.code=='auth/unauthorized-domain'?'（請到 Firebase 的授權網域加入 willy-720.github.io）':'');render()}}
}
const nextLabel=(c,q)=>q==0?'< 1 分':calc(c,q).iv+' 天';
function speak(w,l){try{const u=new SpeechSynthesisUtterance(w);const lg=l||S.acc;u.lang=lg;const vo=speechSynthesis.getVoices().find(x=>x.lang.replace('_','-')==lg);if(vo)u.voice=vo;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const sense=s=>`<div class="sense">${s.pos?`<span class="pos">${esc(s.pos)}</span>`:''}<span class="def">${esc(s.def)}</span><div class="zh">${esc(s.zh)}</div><ul class="exs">${s.ex.map(e=>`<li>${esc(e.en)}${e.zh?`<div class="z">${esc(e.zh)}</div>`:''}</li>`).join('')}</ul></div>`;
function render(){
  document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  const v=document.getElementById('v');
  document.querySelector('nav').style.display=user?'':'none';
  document.getElementById('acct').style.display=user?'':'none';
  if(user){document.getElementById('acem').textContent=guest?'試用模式（資料只存這台裝置）':(user.email||'');document.getElementById('lo').textContent=guest?'離開試用模式':'登出'}
  if(!ready||(user&&!loaded)){v.innerHTML='<div class="stat">載入中…</div><p class="stat">'+msg+'</p>';return}
  if(!user){v.innerHTML=`<div class="card"><div class="word">單字卡</div><div class="ex">登入後，單字與複習進度會在所有裝置同步</div></div><div class="row"><button class="btn pri" id="li">使用 Google 登入</button></div><div class="row"><button class="btn" id="gs">不登入，先試用（資料只存這台裝置）</button></div><p class="stat">${msg}</p>`;document.getElementById('li').onclick=login;document.getElementById('gs').onclick=enterGuest;return}
  if(tab=='s')return renderSet(v);
  if(tab=='r'){
    if(!queue.length){v.innerHTML=`<div class="card"><div class="word">🎉</div><div class="ex">${cards.length?'今天的複習完成了！共 '+cards.length+' 張卡片，明天再來':'還沒有單字，先到「新增」頁貼上單字吧'}</div></div><div class="row"><button class="btn" id="again">再複習一輪（全部）</button></div>`;
      document.getElementById('again').onclick=()=>{queue=cards.slice().sort(()=>Math.random()-.5);render()};return}
    const c=queue[0];
    v.innerHTML=`<div class="stat">待複習 ${queue.length} 張（新單字 ${queue.filter(isNew).length}・複習 ${queue.filter(c=>!isNew(c)).length}）<br>今天到期共 ${qdue} 張${qin?'（其中 '+qin+' 張是今天按過「忘記」、還沒答對的）':''}・每日上限：複習 ${+S.maxRev||'不限'}・新單字 ${+S.maxNew||'不限'}</div><div class="card" id="cd"><div class="word">${esc(c.w)}</div><div class="acc">${[['US','en-US'],['UK','en-GB'],['AU','en-AU']].map(a=>`<button class="ab" data-a="${a[1]}"><b>${a[0]}</b> 🔊</button>`).join('')}</div>${flip?c.senses.map(sense).join('')+noteHtml(c):'<div class="ex">點一下卡片顯示答案</div>'}</div>`+
    (flip?`<div class="row">${['忘記','困難','記得','簡單'].map((t,i)=>`<button data-q="${i}">${t}<small>${nextLabel(c,i)}</small></button>`).join('')}</div>`:`<div class="row"><button class="btn pri" id="show">顯示答案</button></div>`);
    v.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(c.w,b.dataset.a)});
    if(!flip){const f=()=>{flip=true;render()};document.getElementById('cd').onclick=f;document.getElementById('show').onclick=f}
    v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>rate(+b.dataset.q));
  }else if(tab=='a'){
    v.innerHTML=`<label>${editId?'編輯卡片':'貼上單字內容，可一次貼多個單字（單字之間空一行）'}<span class="tip" tabindex="0">?<span class="tb">格式說明：<br>單字<br>詞性<br>英文解釋<br>中文意思<br>英文例句<br>例句翻譯<br>💡筆記（選填）</span></span></label><textarea id="tx" rows="14">${esc(draft)}</textarea><div class="row"><button class="btn" id="pv">整理預覽</button><button class="btn pri" id="add">${editId?'儲存修改':'新增／匯入'}</button>${editId?'<button class="btn" id="cx">取消編輯</button>':''}</div><p class="stat">${msg}</p><div id="pvbox"></div>`;
    document.getElementById('pv').onclick=()=>{const t=document.getElementById('tx'),a=parse(t.value),b=document.getElementById('pvbox');
      if(!a.length){b.innerHTML='<p class="stat">沒有偵測到單字</p>';return}
      t.value=a.map(toText).join('\n\n');
      b.innerHTML='<p class="stat">預覽：單字卡背面的樣子（共 '+a.length+' 張）</p>'+a.map(c=>`<div class="card" style="margin-bottom:12px"><div class="word">${esc(c.w)}</div>${c.senses.map(sense).join('')}${noteHtml(c)}</div>`).join('');
      b.scrollIntoView({behavior:'smooth',block:'nearest'})};
    document.getElementById('add').onclick=async()=>{const arr=parse(document.getElementById('tx').value);
      if(!arr.length){msg='沒有偵測到單字';render();return}
      if(editId){const c=cards.find(x=>x.id==editId);if(c){c.w=arr[0].w;c.senses=arr[0].senses;c.note=arr[0].note||'';saveCard(c)}msg='已儲存 ✓'}
      else{let a=0,m=0,ov=0,sk=0,all=null;
        for(const o of arr){
          let ex=cards.find(c=>c.w.toLowerCase()==o.w.toLowerCase());
          if(!ex){saveCard(mk(o));a++;continue}
          let act=all;
          if(!act){const r=await askDup(o.w,arr.length>1);act=r.a;if(r.all)all=act;ex=cards.find(c=>c.w.toLowerCase()==o.w.toLowerCase())||ex}
          if(act=='over'){ex.w=o.w;ex.senses=o.senses;if(o.note)ex.note=o.note;saveCard(ex);ov++}
          else if(act=='merge'){mergeSenses(ex,o);saveCard(ex);m++}
          else if(act=='both'){saveCard(mk(o));a++}
          else sk++}
        msg=[a&&'新增 '+a,ov&&'覆蓋 '+ov,m&&'合併 '+m,sk&&'略過 '+sk].filter(Boolean).join('、')+' 個單字 ✓'}
      editId=null;draft='';render()};
    if(editId)document.getElementById('cx').onclick=()=>{editId=null;draft='';msg='';render()};
  }else{
    v.innerHTML=`<div class="stat">共 ${cards.length} 張，今天到期 ${due().length} 張</div>`+cards.map((c,i)=>`<div class="item"><div><b>${esc(c.w)}</b> <span>${esc(c.senses[0]?c.senses[0].zh:'')}</span>${c.note?' 📝':''}</div><div><button class="x" data-e="${i}" title="編輯">✎</button><button class="x" data-d="${i}" title="刪除">✕</button></div></div>`).join('')+`<label style="display:block;margin-top:18px">備份（可貼回「新增」頁匯入）</label><textarea id="bk" rows="5" readonly>${esc(cards.map(toText).join('\n\n'))}</textarea><button class="btn" id="cp" style="width:100%">一鍵複製備份</button>${(!guest&&localCards().length&&!localStorage.getItem('vocab-up-'+user.uid))?'<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><button class="btn" id="up">匯入這台裝置的舊版單字到雲端</button><span class="tip" tabindex="0">?<span class="tb">使用時機：<br>登入前，這個瀏覽器裡存有舊版單字<br>想把它們搬到雲端帳號時，按一次<br>雲端已有的同名單字會略過<br>匯入成功後，這個按鈕會自動消失</span></span></div>':''}<p class="stat">${msg}</p>`;
    v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const c=cards[+b.dataset.d];if(c&&confirm('刪除「'+c.w+'」？'))delCard(c.id)});
    v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const c=cards[+b.dataset.e];editId=c.id;draft=toText(c);tab='a';msg='';render()});
    document.getElementById('cp').onclick=async e=>{const b=e.currentTarget,t=document.getElementById('bk');
      try{await navigator.clipboard.writeText(t.value)}catch(_){t.select();document.execCommand('copy')}
      b.textContent='已複製 ✓';setTimeout(()=>{b.textContent='一鍵複製備份'},1500)};
    const ub=document.getElementById('up');
    if(ub)ub.onclick=()=>{const L=localCards();if(!L.length){msg='這台裝置沒有本機舊資料';render();return}upload(L).then(n=>{msg='已匯入 '+n+' 張（重複的單字已略過）';render()}).catch(e=>{msg='匯入失敗：'+(e.code||e.message);render()})};
  }
}
function renderSet(v){
  const n=(k,l,st)=>`<label>${l}</label><input type="number" step="${st||1}" min="0" data-k="${k}" value="${S[k]}">`;
  v.innerHTML=`<label>排程模式</label><select id="md" style="width:100%;padding:10px;margin:4px 0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit"><option value="sm2">自動（SM-2，間隔隨熟悉度成長）</option><option value="ladder">固定階梯（自訂每階天數）</option></select>`+
  (S.mode=='ladder'?`<label>階梯天數（逗號分隔；「記得」升一階，「簡單」升兩階，「困難」退一階）</label><input id="ld" value="${esc(S.ladder)}">`:
  n('first','第一次「記得」的間隔（天）')+n('second','第二次「記得」的間隔（天）')+n('easy1','第一次「簡單」的間隔（天）')+n('hard','「困難」的間隔倍率',.1)+n('bonus','「簡單」的額外倍率',.1)+n('ease','新卡片初始難度係數（越大，間隔成長越快）',.1))+
  `<hr style="border:0;border-top:1px solid var(--bd);margin:8px 0 16px"><label>每日「複習」單字上限（看過的舊單字；0 = 不限制）</label><input type="number" min="0" data-k="maxRev" data-z="1" value="${S.maxRev}"><label>每日「新單字」上限（從沒看過的；0 = 不限制）</label><input type="number" min="0" data-k="maxNew" data-z="1" value="${S.maxNew}"><button class="btn pri" id="sv" style="width:100%">儲存設定</button><button class="btn" id="rs" style="width:100%;margin-top:8px">還原預設</button><p class="stat">${msg}</p><p class="stat">設定只影響之後的評分，已排好的到期日不會改變。</p>`;
  const md=document.getElementById('md');md.value=S.mode;
  md.onchange=()=>{S.mode=md.value;saveS();msg='';render()};
  document.getElementById('sv').onclick=()=>{
    v.querySelectorAll('[data-k]').forEach(i=>{const x=parseFloat(i.value);S[i.dataset.k]=isNaN(x)?DS[i.dataset.k]:(i.dataset.z?Math.floor(Math.max(0,x)):Math.max(1,x))});
    const ld=document.getElementById('ld');if(ld)S.ladder=ld.value.replace(/[^0-9,]/g,'')||DS.ladder;
    saveS();msg='已儲存 ✓';render()};
  document.getElementById('rs').onclick=()=>{S={...DS};saveS();msg='已還原預設';render()};
  
}
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';editId=null;draft='';if(tab=='r')buildQueue();render()});
document.addEventListener('keydown',e=>{if(tab!='r'||!queue.length||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==' '&&!flip){e.preventDefault();flip=true;render()}else if(flip&&'1234'.includes(e.key))rate(+e.key-1)});
document.getElementById('lo').onclick=()=>{document.getElementById('acct').classList.remove('open');guest?exitGuest():signOut(auth)};
document.getElementById('av').onclick=e=>{e.stopPropagation();document.getElementById('acct').classList.toggle('open')};
document.addEventListener('click',e=>{const a=document.getElementById('acct');if(!a.contains(e.target))a.classList.remove('open')});
initFirebase().then(()=>onAuthStateChanged(auth,u=>{if(guest&&!u)return;user=u;ready=true;if(u)startSync();else{stopSync();cards=[];queue=[]}render()})).catch(()=>{ready=true;msg='無法連線到 Google 登入服務，可先使用試用模式';render()});
render();
</script></body></html>
